services:
  cap:
    image: tiago2/cap:3.1.8@sha256:56d402dc15e536b4c20e341a81bb9e78a0082b833e4337b9b05b242d96e0ffe5
    container_name: jxnu-cap
    ports:
      # 默认只绑回环：Cap 的控制台就在根路径上，绝不能直接暴露到公网。
      # 反代与 Cap 不同机时（例如后端搬进校园网、nginx 留在公网边缘），
      # 在 .env 里把 CAP_BIND_ADDR 设成那台机器的内网/覆盖网地址，
      # 让反代够得着，同时仍然不监听公网网卡。
      - "${CAP_BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY:?CAP_ADMIN_KEY must be set in .env}
      REDIS_URL: redis://valkey:6379
      CORS_ORIGIN: ${CAP_CORS_ORIGIN:?CAP_CORS_ORIGIN must be set in .env}
      ENABLE_ASSETS_SERVER: "true"
      WIDGET_VERSION: "0.1.56"
      WASM_VERSION: "0.0.7"
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    container_name: jxnu-cap-valkey
    volumes:
      - cap-valkey-data:/data
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  cap-valkey-data:
