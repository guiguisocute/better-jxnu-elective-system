server {
    listen 80;
    listen [::]:80;
    server_name getxk.jxnu-publish.asia;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/getxk-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name getxk.jxnu-publish.asia;

    ssl_certificate /etc/letsencrypt/live/getxk.jxnu-publish.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getxk.jxnu-publish.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cap's admin/root routes stay loopback-only. Public traffic only needs the
    # widget WASM and the per-site challenge/redeem/siteverify API.
    location = /cap/assets/cap_wasm_bg.wasm {
        rewrite ^/cap/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/cap/[^/]+/(challenge|redeem|siteverify)/?$ {
        rewrite ^/cap/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /cap {
        return 404;
    }

    location /cap/ {
        return 404;
    }

    location /live/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
}
